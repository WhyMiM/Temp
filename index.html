<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

<title>Test</title>
<style>


body {margin: 0; background-color: var(--BackgroundColor); padding-left: var(--HorizontalPadding); padding-right: var(--HorizontalPadding)}
/*---------------------------------------------------------------------- Header stuff -----------------------------------------------------------------------*/
#HeaderContainer {
  user-select: none;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  margin-left: calc(-1 * var(--HorizontalPadding));
  width: calc(100% + (var(--HorizontalPadding) * 2));
  box-sizing: border-box;
  border-style: solid;
}

#HeaderCarousel {
  background-color: #31557d;
  overflow: hidden;
  position: relative;
  width: 100%;
  height: 100%;
  box-sizing: border-box;
}

#HeaderCarouselTrack {
  -webkit-user-drag: none;
  -moz-user-drag: none;
  -ms-user-drag: none;
  user-drag: none;
  user-select: none;
  will-change: transform;
  opacity: 0;
  transition: opacity 2s;
  display: flex;
  position: absolute;
  height: 100%;
  visibility: hidden;
  align-items: center; 
}

#HeaderCarouselTrack img {
  box-sizing: border-box;
  -webkit-user-drag: none;
  -moz-user-drag: none;
  -ms-user-drag: none;
  user-drag: none;
  user-select: none;
  flex-shrink: 0;
  object-fit: cover;
  height: 90%;
}


#HeaderTextContainer {
  z-index: 1;
  box-sizing: border-box;
  position: absolute;
  margin: 0px;
  opacity: 0;
  padding: 15px;
  padding-top: 10px;
  backdrop-filter: blur(5px);
  background: rgba(255, 255, 255, 0.1);
  border-radius: 1rem;
  box-shadow: inset 0px 5px 10px rgba(90, 140, 190, 1),
             inset 0px -5px 10px rgba(0, 0, 0, 0.4);
  border: 5px solid rgba(90, 140, 190,0.1);
  outline: 3px solid rgba(255, 255, 255,0.1);
  outline-offset: -1px;
}


#HeaderText, #HeaderSubText {
  user-select: none;
  -webkit-user-drag: none;
  margin: 0;
  font-family: "Rubik";
  font-weight: 500;
  color: RGBA(255,255,255, 1);
  text-align: center;
}

#HeaderSubText a {color: #78c7ff; text-decoration: none} #HeaderSubText a:hover {text-decoration: underline}

@keyframes fadeslide {0% {opacity: 0; transform: translateY(5px)} 100% {opacity: 1; transform: translateY(-5px)}}


</style>
</head>
<body>
<div id="HeaderContainer">
  <div id="HeaderTextContainer">
    <p id="HeaderText">Entities by MiM</p>
    <p id="HeaderSubText">for the <a target="_blank" draggable="false" href="https://ddnet.org">DDNet</a> client</p>
  </div>
  <div id="HeaderCarousel">
    <div id="HeaderCarouselTrack">
      <img src=""/>
      <img src="https://i.imgur.com/5IJ6nFb.png"/>
      <img src="https://i.imgur.com/MLwmQ8J.png"/>
      <img src="https://i.imgur.com/fflP2aU.png"/>
      <img src="https://i.imgur.com/WR1XIHA.png"/>
      <img src="https://i.imgur.com/5IJ6nFb.png"/>
      <img src="https://i.imgur.com/MLwmQ8J.png"/>
      <img src="https://i.imgur.com/fflP2aU.png"/>
      <img src="https://i.imgur.com/WR1XIHA.png"/>
      <img src="https://i.imgur.com/5IJ6nFb.png"/>
      <img src="https://i.imgur.com/MLwmQ8J.png"/>
      <img src="https://i.imgur.com/fflP2aU.png"/>
      <img src="https://i.imgur.com/WR1XIHA.png"/>

    </div>
  </div>
</div>

<script>

function GetZoomFactor() {return window.devicePixelRatio || 1};
const root = document.documentElement.style;
const zoom = 1 / GetZoomFactor();
//--------------------------------------------------------------------- Header Carousel ---------------------------------------------------------------------//
let CarouselPosition = 0;
let PrevTimestamp = null;
let CarouselImageWidths = [];

const HeaderContainer = document.getElementById("HeaderContainer");
const HeaderCarouselTrack = document.getElementById("HeaderCarouselTrack");
const HeaderTextContainer = document.getElementById("HeaderTextContainer");
const HeaderText = document.getElementById("HeaderText");
const HeaderSubText = document.getElementById("HeaderSubText");
let CarouselImages = Array.from(HeaderCarouselTrack.children);



const HeaderConfig = {
  Height: 220,
  BorderSize: 8,
  BackgroundColor: "#31557d",
  BorderColor: "RGBA(255, 255, 255, 0.1)",
  TextAnimation: "1.5s",
  TextSize: 52,
  SubTextSize: 14,

  CarouselSpeed: 30,
  CarouselImageSpacing: 16,

  CarouselImageBorderSize: 6,
  CarouselImageBorderRadius: 22,
  CarouselImageBorderColor: "RGBA(90, 140, 190, 0.1)",
  CarouselImageOutlineSize: 3,
  CarouselImageOutlineOffset: -1,
  CarouselImageOutlineColor: "RGBA(255, 255, 255, 0.1)",

  CarouselImageShadow1X: 2,
  CarouselImageShadow1Y: -2,
  CarouselImageShadow1Blur: 4,
  CarouselImageShadow1Color: "RGBA(90, 140, 190, 1)",
  CarouselImageShadow2X: -2,
  CarouselImageShadow2Y: 4,
  CarouselImageShadow2Blur: 4,
  CarouselImageShadow2Color: "RGBA(0, 0, 0, 1)",
};



const RootHeaderVars = {
"--BackgroundColor": "#222",
"--HorizontalPadding": "22px",

"--HeaderHeight": `${HeaderConfig.Height * zoom}px`,
"--HeaderBorderSize": `${HeaderConfig.BorderSize / zoom}px 0`,

"--HeaderTextSize": `${HeaderConfig.TextSize / zoom}px 0`,
"--HeaderSubTextSize": `${HeaderConfig.SubTextSize / zoom}px 0`,


"--CImgSpacing": `${HeaderConfig.CarouselImageSpacing * zoom}px`,
"--CImgBorderSize": `${HeaderConfig.CarouselImageBorderSize * zoom}px`,
"--CImgBorderRadius": `${HeaderConfig.CarouselImageBorderRadius * zoom}px`,
"--CImgBorderColor": `${HeaderConfig.CarouselImageBorderColor}`,
"--CImgOutlineSize": `${HeaderConfig.CarouselImageOutlineSize * zoom}px`,
"--CImgOutlineOffset": `${HeaderConfig.CarouselImageOutlineOffset * zoom}px`,
"--CImgOutlineColor": `${HeaderConfig.CarouselImageOutlineColor}`,
"--CImgShadow1X": `${HeaderConfig.CarouselImageShadow1X * zoom}px`,
"--CImgShadow1Y": `${HeaderConfig.CarouselImageShadow1Y * zoom}px`,
"--CImgShadow1Blur": `${HeaderConfig.CarouselImageShadow1Blur * zoom}px`,
"--CImgShadow1Color": `${HeaderConfig.CarouselImageShadow1Color}`,
"--CImgShadow2X": `${HeaderConfig.CarouselImageShadow2X * zoom}px`,
"--CImgShadow2Y": `${HeaderConfig.CarouselImageShadow2Y * zoom}px`,
"--CImgShadow2Blur": `${HeaderConfig.CarouselImageShadow2Blur * zoom}px`,
"--CImgShadow2Color": `${HeaderConfig.CarouselImageShadow2Color}`,
}; for (const key in RootHeaderVars) {root.setProperty(key, RootHeaderVars[key])};


CarouselImages.forEach(img => {
  img.style.setProperty("border", `var(--CImgBorderSize) solid var(--CImgBorderColor)`);
  img.style.setProperty("border-radius", `var(--CImgBorderRadius)`);
  img.style.setProperty("outline", `var(--CImgOutlineSize) solid var(--CImgOutlineColor)`);
  img.style.setProperty("outline-offset", `var(--CImgOutlineOffset)`);
  img.style.setProperty("filter", `drop-shadow(var(--CImgShadow1X) var(--CImgShadow1Y) var(--CImgShadow1Blur) var(--CImgShadow1Color))
                                       drop-shadow(var(--CImgShadow2X) var(--CImgShadow2Y) var(--CImgShadow2Blur) var(--CImgShadow2Color))`);
});





HeaderContainer.style.setProperty("height", `var(--HeaderHeight)`);
HeaderContainer.style.setProperty("border-width", `var(--HeaderBorderSize)`);
HeaderContainer.style.setProperty("border-color", `${HeaderConfig.BorderColor}`);
HeaderContainer.style.setProperty("background-color", `${HeaderConfig.BackgroundColor}`);

HeaderText.style.setProperty("font-size", `var(--HeaderTextSize)`);
HeaderSubText.style.setProperty("font-size", `var(--HeaderSubTextSize)`);

HeaderCarouselTrack.style.setProperty("gap", `var(--CImgSpacing)`);





function updateSizes() {
  const zoom = 1 / GetZoomFactor();

  root.setProperty("--HeaderHeight", `${HeaderConfig.Height * zoom}px`);
  root.setProperty("--HeaderBorderSize", `${HeaderConfig.BorderSize * zoom}px 0`);

  root.setProperty("--HeaderTextSize", `${HeaderConfig.TextSize * zoom}px`);
  root.setProperty("--HeaderSubTextSize", `${HeaderConfig.SubTextSize * zoom}px`);

  root.setProperty("--CImgSpacing", `${HeaderConfig.CarouselImageSpacing * zoom}px`);
  root.setProperty("--CImgBorderSize", `${HeaderConfig.CarouselImageBorderSize * zoom}px`);
  root.setProperty("--CImgBorderRadius", `${HeaderConfig.CarouselImageBorderRadius * zoom}px`);
  root.setProperty("--CImgOutlineSize", `${HeaderConfig.CarouselImageOutlineSize * zoom}px`);
  root.setProperty("--CImgOutlineOffset", `${HeaderConfig.CarouselImageOutlineOffset * zoom}px`);
  root.setProperty("--CImgShadow1X", `${HeaderConfig.CarouselImageShadow1X * zoom}px`);
  root.setProperty("--CImgShadow1Y", `${HeaderConfig.CarouselImageShadow1Y * zoom}px`);
  root.setProperty("--CImgShadow1Blur", `${HeaderConfig.CarouselImageShadow1Blur * zoom}px`);
  root.setProperty("--CImgShadow2X", `${HeaderConfig.CarouselImageShadow2X * zoom}px`);
  root.setProperty("--CImgShadow2Y", `${HeaderConfig.CarouselImageShadow2Y * zoom}px`);
  root.setProperty("--CImgShadow2Blur", `${HeaderConfig.CarouselImageShadow2Blur * zoom}px`);

  CarouselImageWidths = CarouselImages.map(img => img.getBoundingClientRect().width + (HeaderConfig.CarouselImageSpacing * zoom));
}




document.addEventListener("visibilitychange", () => {
    if (document.hidden) PrevTimestamp = null;
});

function animateCarousel(timestamp) {
    if (!PrevTimestamp) PrevTimestamp = timestamp;

    let deltaSeconds = (timestamp - PrevTimestamp) / 1000;
    deltaSeconds = Math.min(deltaSeconds, 0.05);

    PrevTimestamp = timestamp;
    const zoom = GetZoomFactor();
    CarouselPosition -= HeaderConfig.CarouselSpeed * deltaSeconds / zoom;

    if (-CarouselPosition >= CarouselImageWidths[0]) {
        CarouselPosition += CarouselImageWidths[0];
        HeaderCarouselTrack.appendChild(CarouselImages[0]);
        CarouselImages.push(CarouselImages.shift());
        updateSizes()
    }

    HeaderCarouselTrack.style.transform = `translate3d(${CarouselPosition}px, 0, 0)`;
    requestAnimationFrame(animateCarousel);
}

// Wait for all images to load
function imagesLoaded(imgs) {
    return Promise.all(
        imgs.map(img => img.complete ? Promise.resolve() :
            new Promise(resolve => img.onload = resolve)
        )
    );
}

// Initial setup
imagesLoaded(CarouselImages).then(() => {
  HeaderCarouselTrack.style.visibility = "visible";
  requestAnimationFrame(() => {
    HeaderCarouselTrack.style.opacity = "1";
    setTimeout(() => {

      void HeaderTextContainer.offsetWidth;
      HeaderTextContainer.style.animation = `fadeslide ${HeaderConfig.TextAnimation} forwards`;
    }, 1300); // match carousel opacity transition duration
  });

  updateSizes();
  requestAnimationFrame(animateCarousel);
});



// Update on resize
window.addEventListener("resize", () => {
    requestAnimationFrame(() => {
        updateSizes();
    });
});

</script>
</body>
</html>
